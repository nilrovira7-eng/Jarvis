<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06121c">
<title>Jarvis</title>
<style>
:root{--bg:#06121c;--ink:#d8f3ff;--dim:#6f93a6;--arc:#4fd8ff;--warm:#ffb347;--line:#12384d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
main{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:24px;min-height:0}
#orb{width:200px;height:200px;border:0;border-radius:50%;background:transparent;padding:0;cursor:pointer;flex:none;-webkit-tap-highlight-color:transparent}
#orb img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 0 10px #4fd8ff88);transition:filter .2s}
#orb:focus-visible{outline:3px solid var(--warm);outline-offset:5px}
#orb.listening img{filter:drop-shadow(0 0 16px #ffb347) drop-shadow(0 0 6px #ffb347);animation:pulse 1.1s ease-in-out infinite}
#orb.thinking img{animation:spin 6s linear infinite}
#orb.speaking img{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#orb img{animation:none!important}}
#status{color:var(--dim);min-height:1.5em;margin:0}
#log{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{padding:8px 12px;border-left:2px solid var(--line);max-width:92%}
.m.u{align-self:flex-end;border-left:0;border-right:2px solid var(--warm);text-align:right;color:var(--dim)}
.m.j{border-left-color:var(--arc)}
details{width:100%;margin-bottom:12px;color:var(--dim)}
summary{cursor:pointer}
label{display:block;margin-top:10px;font-size:14px}
input,textarea{width:100%;background:#0b1f2d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
textarea{height:140px}
</style>
</head>

  <p id="status" role="status">Toca el cercle i parla.</p>
  <div id="log" aria-live="polite"></div>
  <details>
    <summary>Configuració</summary>
    <label>Clau API de Gemini <input id="key" type="password" autocomplete="off" placeholder="Enganxa la clau aquí"></label>
    <label>Model <input id="model" value="gemini-2.5-flash"></label>
    <label>Personalitat <textarea id="persona"></textarea></label>
    <label><button id="reset" type="button">Esborrar la conversa</button></label>
  </details>
</main>
<script>
const $ = id => document.getElementById(id);
const DEFAULT_PERSONA = "Ets Jarvis, l'assistent personal d'una persona que et parla en català. Ets educat, eficient i amb un punt d'ironia britànica discreta. Les teves respostes es llegeixen en veu alta: fes-les curtes (1-3 frases), sense llistes, sense markdown ni emojis. Si no saps una cosa, ho dius.";
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let history = [];
try { history = JSON.parse(store.get("history", "[]")); } catch(e){}
$("key").value = store.get("key", "");
$("model").value = store.get("model", "gemini-2.5-flash");
$("persona").value = store.get("persona", DEFAULT_PERSONA);
["key","model","persona"].forEach(id => $(id).addEventListener("change", () => store.set(id, $(id).value)));
$("reset").onclick = () => { history = []; store.set("history", "[]"); $("log").innerHTML = ""; setStatus("Conversa esborrada."); };

function setStatus(t){ $("status").textContent = t; }
function setState(s){ $("orb").className = s; }
function addMsg(who, text){
  const d = document.createElement("div");
  d.className = "m " + who; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
history.forEach(h => addMsg(h.role === "user" ? "u" : "j", h.parts[0].text));

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, busy = false;

function pickVoice(){
  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang.toLowerCase().startsWith("ca")) || v.find(x => x.lang.toLowerCase().startsWith("es")) || null;
}
function speak(text){
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "ca-ES";
    u.rate = 1.02;
    u.onend = u.onerror = res;
    speechSynthesis.speak(u);
  });
}

async function ask(text){
  const key = $("key").value.trim();
  if (!key){ setStatus("Falta la clau API (a Configuració)."); setState(""); return; }
  history.push({ role: "user", parts: [{ text }] });
  addMsg("u", text); setState("thinking"); setStatus("Pensant...");
  try {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent($("model").value.trim()) + ":generateContent?key=" + encodeURIComponent(key);
    const r = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: $("persona").value }] }, contents: history.slice(-20) })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error && data.error.message || r.status);
    const reply = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim() || "No he sabut què dir.";
    history.push({ role: "model", parts: [{ text: reply }] });
    history = history.slice(-40); store.set("history", JSON.stringify(history));
    addMsg("j", reply); setState("speaking"); setStatus("Parlant...");
    await speak(reply);
    setStatus("Toca el cercle i parla.");
  } catch(e){
    history.pop(); setStatus("Error: " + e.message);
  }
  setState(""); busy = false;
}

$("orb").onclick = () => {
  if (!SR){ setStatus("Aquest navegador no té reconeixement de veu. Prova Chrome."); return; }
  if (busy){ speechSynthesis.cancel(); return; }
  busy = true; speechSynthesis.cancel();
  rec = new SR(); rec.lang = "ca-ES"; rec.interimResults = false; rec.maxAlternatives = 1;
  let got = false;
  rec.onstart = () => { setState("listening"); setStatus("T'escolto..."); };
  rec.onresult = e => { got = true; ask(e.results[0][0].transcript); };
  rec.onerror = e => { got = true; busy = false; setState(""); setStatus("Error de micròfon: " + e.error); };
  rec.onend = () => { if (!got){ busy = false; setState(""); setStatus("No he sentit res."); } };
  rec.start();
};
speechSynthesis.onvoiceschanged = () => {};
</script>
